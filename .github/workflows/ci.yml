name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: manifests and grammar parse
        run: |
          for f in package.json language-configuration.json syntaxes/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
          done
      - run: node --check extension.js
      - run: npx --yes @vscode/vsce package -o mach.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: mach-vsix
          path: mach.vsix

  gate:
    if: always()
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
